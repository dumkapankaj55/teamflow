services:
  - type: web
    name: teamflow-api
    runtime: node
    rootDir: .
    buildCommand: npm ci
    startCommand: npm run start --workspace server
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: ACCESS_TOKEN_SECRET
        generateValue: true
      - key: ACCESS_TOKEN_TTL
        value: 15m
      - key: REQUIRE_EMAIL_VERIFICATION
        value: "true"
      - key: REFRESH_TOKEN_TTL_DAYS
        value: 30
      - key: COOKIE_NAME
        value: teamflow_refresh
      - key: COOKIE_SECURE
        value: "true"
      - key: COOKIE_SAME_SITE
        value: none
      - key: CORS_ORIGINS
        sync: false
      - key: CLIENT_URL
        sync: false
      - key: PASSWORD_RESET_URL
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM_EMAIL
        sync: false
      - key: TURNSTILE_SITE_KEY
        sync: false
      - key: TURNSTILE_SECRET_KEY
        sync: false
